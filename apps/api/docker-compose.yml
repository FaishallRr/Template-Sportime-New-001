services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: padelpoint-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: padelpoint
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: padelpass_secure_2026
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./migrations/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
      - ./migrations/003_auth_security.sql:/docker-entrypoint-initdb.d/003_auth_security.sql
      - ./migrations/003b_phone.sql:/docker-entrypoint-initdb.d/003b_phone.sql
      - ./migrations/004_demo_users.sql:/docker-entrypoint-initdb.d/004_demo_users.sql
      - ./migrations/005_soft_delete_and_promos.sql:/docker-entrypoint-initdb.d/005_soft_delete_and_promos.sql
      - ./migrations/006_fix_missing_columns.sql:/docker-entrypoint-initdb.d/006_fix_missing_columns.sql
      - ./migrations/007_sport_type.sql:/docker-entrypoint-initdb.d/007_sport_type.sql
      - ./migrations/019_seed_reviews.sql:/docker-entrypoint-initdb.d/019_seed_reviews.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padelpoint"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── Redis Cache for Schedule ──
  redis:
    image: redis:7-alpine
    container_name: padelpoint-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Go API Server ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: padelpoint-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - APP_ENV=production

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local